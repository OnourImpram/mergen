name: Release

# Publishing is deliberately gated on a tag. A dispatch run builds and checks
# the artifacts but never uploads, so the pipeline can be exercised without
# spending a version number.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Version sources agree
        run: python scripts/validate_version.py

      - name: Tag matches the declared version
        if: github.ref_type == 'tag'
        run: |
          declared="$(python -c "import re,pathlib;print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $declared"
            exit 1
          fi
          echo "tag and pyproject agree at $declared"

      - name: Test suite
        run: |
          python -m pip install -e . pytest jsonschema
          python -m pytest -q --ignore=tests/test_mergen_supervise.py

      - name: Build sdist and wheel
        run: python -m build --outdir build/artifacts

      - name: Check metadata
        run: python -m twine check build/artifacts/*

      - name: Distribution name is the published one
        run: |
          ls build/artifacts/
          if ! ls build/artifacts/ | grep -q "^mergen_verdict-"; then
            echo "::error::built artifacts are not named mergen_verdict"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: build/artifacts/

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: build/artifacts/

      - name: Publish via trusted publisher
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: build/artifacts/
          attestations: true
          verbose: true
