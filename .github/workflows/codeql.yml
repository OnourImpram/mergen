name: CodeQL

# Static analysis of the Python surface. Honest scope: CodeQL on a PRIVATE
# repository requires GitHub Advanced Security. This workflow is committed so the
# scan is one repository-admin toggle away, the same honesty as the attestation
# and branch-protection steps. On a private repo without GHAS it does not run. On
# a public repo, or a private repo with GHAS enabled, it runs as written.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: "CodeQL (python)"
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:python"
